_target_: src.models.mnist_module.MnistModule

optimizer:
  _partial_: True
  _target_: optax.adam
  learning_rate: 0.001

scheduler:
  _target_: optax.schedules.cosine_decay_schedule
  init_value: 0.1
  decay_steps: 100

net:
  _target_: src.models.components.simple_dense_net.SimpleDenseNet
  input_size: 784
  lin1_size: 64
  lin2_size: 128
  lin3_size: 64
  output_size: 10

compile: false
